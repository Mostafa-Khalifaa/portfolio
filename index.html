      rel="stylesheet"

    <link rel="stylesheet" href="src/styles/main.css" />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // ThemeService repeats this logic; duplicating ~6 lines here is the
      // accepted trade-off for avoiding a flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem("mk-portfolio-theme");
          if (stored) document.documentElement.setAttribute("data-theme", stored);
        } catch (e) {
          /* storage blocked — keep the dark default from the html attribute */
        }
      })();
    </script>

    <script type="module" src="src/main.js"></script>
